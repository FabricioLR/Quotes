services:
  quotes_app:
    build:
      context: .
      target: prod
      dockerfile: docker/Dockerfile
    container_name: quotes_app_prod
    user: "www-data:www-data"
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - data:/var/www/storage
    networks:
      - net

  quotes_nginx:
    build:
      context: .
      target: nginx
      dockerfile: docker/Dockerfile
    container_name: quotes_nginx_prod
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - net

networks:
  net:
    driver: bridge

volumes:
  data: